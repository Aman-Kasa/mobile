plugins {
    id 'com.android.application'
}

android {
    namespace 'com.burdew.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.burdew.app'
        minSdk 21            // affordable / older phones
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        multiDexEnabled true

        javaCompileOptions {
            annotationProcessorOptions {
                // Room writes its schema here so every migration can be checked in review.
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    def room = '2.6.1'
    def lifecycle = '2.6.2'
    def mapsforge = '0.21.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle"

    implementation "androidx.room:room-runtime:$room"
    annotationProcessor "androidx.room:room-compiler:$room"

    // Offline OpenStreetMap rendering. No Google Play Services anywhere in the app.
    implementation "org.mapsforge:mapsforge-core:$mapsforge"
    implementation "org.mapsforge:mapsforge-map:$mapsforge"
    implementation "org.mapsforge:mapsforge-map-reader:$mapsforge"
    implementation "org.mapsforge:mapsforge-themes:$mapsforge"
    implementation "org.mapsforge:mapsforge-map-android:$mapsforge"
    implementation 'com.caverock:androidsvg:1.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "androidx.room:room-testing:$room"
}
